name: Test

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  host-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Python syntax
        run: |
          python3 -m compileall -q tools server scripts
          python3 -m py_compile \
            scripts/project_check.py \
            scripts/benchmark.py \
            scripts/hil_test.py

      - name: Static project closure
        run: python3 scripts/project_check.py --static-only

      - name: JojoDiff regression
        run: python3 tests/unit/test_jojodiff.py

      - name: ESP32 secure-container UART contract
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror \
            -Igateway-esp32/components/secure_container_meta/include \
            -Igateway-esp32/components/uart_ota/include \
            gateway-esp32/components/secure_container_meta/secure_container_meta.c \
            gateway-esp32/components/uart_ota/uart_ota_protocol.c \
            tests/host/test_gateway_contract.c \
            -o /tmp/gateway_contract

          /tmp/gateway_contract
