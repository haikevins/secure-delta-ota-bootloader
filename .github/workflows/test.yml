name: Host Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-and-host-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python syntax
        run: |
          python3 -m py_compile             scripts/project_check.py             scripts/benchmark.py             scripts/hil_test.py             scripts/gateway_hil_support.py             scripts/security_hil_support.py             scripts/release_hil_support.py             tools/release.py             tools/secure_container.py             tools/keytool.py             tools/delta.py             tools/delta_artifact.py             tools/mqtt_protocol.py             tools/mqtt_test_broker.py             tools/fault_https_server.py             server/app/main.py             server/app/services/*.py
      - name: Static project closure
        run: python3 scripts/project_check.py --static-only
