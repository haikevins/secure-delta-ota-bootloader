name: Firmware Release

on:
  workflow_dispatch:
    inputs:
      target_version:
        description: "Target STM32 application version (uint32 decimal)"
        required: true
        type: string
      base_version:
        description: "Previous published version for delta generation, or 0 for full-only"
        required: true
        default: "0"
        type: string
      channel:
        description: "Release channel"
        required: true
        default: stable
        type: choice
        options: [stable, beta, dev]
      release_notes:
        description: "Short release note"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install STM32 toolchain and OpenSSL
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi openssl
      - name: Validate repository and release tooling
        run: make check TOOLCHAIN=gcc

  release:
    needs: validate
    runs-on: ubuntu-latest
    environment: firmware-production
    concurrency:
      group: firmware-production
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      TARGET_VERSION: ${{ inputs.target_version }}
      BASE_VERSION: ${{ inputs.base_version }}
      CHANNEL: ${{ inputs.channel }}
      RELEASE_BASE_URL: ${{ vars.RELEASE_BASE_URL }}
      RELEASE_KEY_ID: ${{ vars.RELEASE_KEY_ID }}
      SDOTA_TRUSTED_KEY_SHA256: ${{ vars.SDOTA_TRUSTED_KEY_SHA256 }}
      SIGNING_KEY_PEM: ${{ secrets.SIGNING_KEY_PEM }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Install STM32 toolchain and OpenSSL
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi openssl

      - name: Validate protected release configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$RELEASE_BASE_URL"
          case "$RELEASE_BASE_URL" in
            https://*) ;;
            *) echo "RELEASE_BASE_URL must use https://" >&2; exit 1 ;;
          esac
          test -n "$RELEASE_KEY_ID"
          test -n "$SDOTA_TRUSTED_KEY_SHA256"
          test -n "$SIGNING_KEY_PEM"

      - name: Materialize signing key in runner temp
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          KEY="$RUNNER_TEMP/release-signing-private.pem"
          printf '%s
' "$SIGNING_KEY_PEM" > "$KEY"
          chmod 600 "$KEY"
          echo "SIGNING_KEY_PATH=$KEY" >> "$GITHUB_ENV"

      - name: Build target application
        shell: bash
        run: |
          set -euo pipefail
          make -C node-stm32f103/application             TOOLCHAIN=gcc             BUILD_DIR=build-release             OUT_DIR=out-release             PROJECT_CFLAGS="-DAPPLICATION_VERSION=${TARGET_VERSION}UL"             clean all
          echo "TARGET_BIN=$GITHUB_WORKSPACE/node-stm32f103/application/out-release/application.bin" >> "$GITHUB_ENV"

      - name: Retrieve exact previous release base
        if: ${{ inputs.base_version != '0' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release-base"
          gh release download "fw-v${BASE_VERSION}"             --pattern "application-v${BASE_VERSION}.bin"             --dir "$RUNNER_TEMP/release-base"
          BASE="$RUNNER_TEMP/release-base/application-v${BASE_VERSION}.bin"
          test -f "$BASE"
          echo "BASE_BIN=$BASE" >> "$GITHUB_ENV"

      - name: Create signed immutable release
        shell: bash
        env:
          RELEASE_NOTE_LINE: ${{ inputs.release_notes }}
        run: |
          set -euo pipefail
          RELEASE_ID="fw-v${TARGET_VERSION}"
          NOTES="$RUNNER_TEMP/release-notes.md"
          {
            echo "# Firmware ${RELEASE_ID}"
            echo
            echo "- Channel: \`${CHANNEL}\`"
            echo "- Target version: \`v${TARGET_VERSION}\`"
            if [ -n "$RELEASE_NOTE_LINE" ]; then
              echo "- ${RELEASE_NOTE_LINE}"
            fi
          } > "$NOTES"

          args=(
            python3 tools/release.py
            --target "$TARGET_BIN"
            --target-version "$TARGET_VERSION"
            --key "$SIGNING_KEY_PATH"
            --key-id "$RELEASE_KEY_ID"
            --base-url "$RELEASE_BASE_URL"
            --channel "$CHANNEL"
            --release-id "$RELEASE_ID"
            --output-root dist/releases
            --notes "$NOTES"
            --source-revision "$GITHUB_SHA"
          )

          if [ "$BASE_VERSION" != "0" ]; then
            args+=(--base "$BASE_BIN" --base-version "$BASE_VERSION")
          fi

          "${args[@]}"
          python3 server/app/main.py verify             --release-root dist/releases             --release-id "$RELEASE_ID"

      - name: Publish GitHub release assets
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_ID="fw-v${TARGET_VERSION}"
          RELEASE_DIR="dist/releases/${RELEASE_ID}"
          if gh release view "$RELEASE_ID" >/dev/null 2>&1; then
            echo "GitHub release ${RELEASE_ID} already exists; refusing overwrite." >&2
            exit 1
          fi
          gh release create "$RELEASE_ID"             "$RELEASE_DIR"/*             --target "$GITHUB_SHA"             --title "Firmware ${RELEASE_ID}"             --notes-file "$RELEASE_DIR/release-notes.md"

      - name: Remove signing key
        if: ${{ always() }}
        shell: bash
        run: rm -f "${SIGNING_KEY_PATH:-}"
