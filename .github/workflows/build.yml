name: Build
on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  stm32-phase17:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi openssl
      - run: make phase17-check TOOLCHAIN=gcc
