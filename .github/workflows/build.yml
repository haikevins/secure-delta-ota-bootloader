name: Build and Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install STM32 toolchain and OpenSSL
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi openssl
      - name: Run warning-clean STM32 build
        run: make warning-check TOOLCHAIN=gcc
      - name: Run integrated project checks
        run: make check TOOLCHAIN=gcc
      - name: Run reproducible benchmark
        run: make benchmark TOOLCHAIN=gcc
